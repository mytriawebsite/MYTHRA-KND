<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYTRIA - Loja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #060b18; color: #f8fafc; padding-bottom: 50px; overflow-x: hidden; }
        .shop-container { width: 100%; max-width: 1200px; margin: 10px auto; padding: 0 8px; }
        .shop-header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .shop-title { font-size: 1rem; font-weight: bold; color: #00f2ff; display: flex; align-items: center; gap: 6px; }
        .item-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .shop-item-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .item-icon-box { width: 50px; height: 50px; background: #162032; border: 1px solid #334155; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
        .item-icon-box img { max-height: 40px; max-width: 45px; object-fit: contain; }
        .item-details { flex: 1; min-width: 0; }
        .item-name { font-size: 0.8rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-sub { font-size: 0.65rem; color: #84cc16; margin-top: 2px; }
        .buy-btn { background: #00f2ff; color: #060b18; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>
    <script type="module" src="header-template.js"></script>
    <div class="shop-container">
        <div class="shop-header-bar">
            <div class="shop-title"><i class="fa-solid fa-shop"></i> Loja Oficial MYTRIA</div>
        </div>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;">Adquira novos racks e mineradoras para sua sala:</div>
        <div class="item-list" id="shop-items-list"></div>
    </div>

    <script>
        async function carregarLoja() {
            const listEl = document.getElementById('shop-items-list');
            listEl.innerHTML = '';

            try {
                const [rRes, mRes] = await Promise.all([
                    fetch('items-racks.json'),
                    fetch('items-miners.json')
                ]);
                const rJson = await rRes.json();
                const mJson = await mRes.json();

                let html = '';

                // Exibe todos os 6 racks oficiais fatiados na loja
                Object.entries(rJson.items || {}).forEach(([id, meta]) => {
                    html += `
                        <div class="shop-item-card">
                            <div class="item-icon-box"><img src="${meta.asset}" alt="${meta.name}"></div>
                            <div class="item-details">
                                <div class="item-name">${meta.name}</div>
                                <div class="item-sub">Estante Oficial | ID: ${id}</div>
                            </div>
                            <button class="buy-btn" onclick="alert('Item ${meta.name} adquirido com sucesso!')">Comprar</button>
                        </div>
                    `;
                });

                // Exibe as mineradoras
                Object.entries(mJson.items || {}).forEach(([id, meta]) => {
                    html += `
                        <div class="shop-item-card">
                            <div class="item-icon-box"><img src="${meta.asset}" alt="${meta.name}"></div>
                            <div class="item-details">
                                <div class="item-name">${meta.name}</div>
                                <div class="item-sub">${meta.hashPower || 'Mineradora'} | ID: ${id}</div>
                            </div>
                            <button class="buy-btn" onclick="alert('Item ${meta.name} adquirido com sucesso!')">Comprar</button>
                        </div>
                    `;
                });

                listEl.innerHTML = html;
            } catch (e) {
                console.error("Erro ao carregar itens da loja:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', carregarLoja);
    </script>
</body>
</html>
