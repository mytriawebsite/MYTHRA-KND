<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYTRIA - ADM ROOM</title>
  <style>
    body { background: #04060b; color: #f8fafc; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
    .card { background: #080e1d; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; }
    h1 { color: #00f2ff; font-size: 1.2rem; margin-bottom: 15px; }
    .row { display: flex; justify-content: space-between; align-items: center; background: #0c1421; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #29374b; }
    button { background: #1e293b; color: white; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:active { background: #00f2ff; color: #000; }
    .val { color: #84cc16; font-family: monospace; font-weight: bold; }
    .back { display: block; margin-top: 15px; background: #00f2ff; color: #0f172a; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚙️ MYTRIA - ADM ROOM (Calibração)</h1>
    
    <div class="row">
      <span>1ª Prateleira</span>
      <div>
        <button onclick="change(1, -5)">-5</button>
        <span id="s1" class="val">0px</span>
        <button onclick="change(1, 5)">+5</button>
      </div>
    </div>

    <div class="row">
      <span>2ª Prateleira</span>
      <div>
        <button onclick="change(2, -5)">-5</button>
        <span id="s2" class="val">0px</span>
        <button onclick="change(2, 5)">+5</button>
      </div>
    </div>

    <div class="row">
      <span>3ª Prateleira</span>
      <div>
        <button onclick="change(3, -5)">-5</button>
        <span id="s3" class="val">0px</span>
        <button onclick="change(3, 5)">+5</button>
      </div>
    </div>

    <div class="row">
      <span>4ª Prateleira (Base)</span>
      <div>
        <button onclick="change(4, -10)">-10</button>
        <span id="s4" class="val">-110px</span>
        <button onclick="change(4, 10)">+10</button>
      </div>
    </div>

    <a href="index.html" class="back">Voltar para a Home Page</a>
  </div>

  <script>
    function getOpt() {
      let d = localStorage.getItem('mytria_shelf_offsets');
      return d ? JSON.parse(d) : {1:0, 2:0, 3:0, 4:-110};
    }
    function save(o) {
      localStorage.setItem('mytria_shelf_offsets', JSON.stringify(o));
      render();
    }
    function change(r, v) {
      let o = getOpt();
      o[r] = (o[r] || 0) + v;
      save(o);
    }
    function render() {
      let o = getOpt();
      for(let i=1; i<=4; i++) {
        document.getElementById('s'+i).textContent = (o[i] > 0 ? '+' : '') + o[i] + 'px';
      }
    }
    render();
  </script>
</body>
</html>
